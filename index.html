<title>Gaitworks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: engineering-plate workspace. A measured stage (editor or race track) on the left,
   a four-tab bench on the right. Bone = ink, muscle = vermilion (contracted) to blue (extended). */
:root {
  --bg: #E6EBEE; --panel: #F4F7F8; --panel-2: #E8EDF0; --ink: #13202A; --ink-2: #4F606C; --line: #C5CED4;
  --stage: #EEF3F5; --grid: #DCE4E8; --grid-2: #C6D1D8; --ground: #CBD5DB; --ground-top: #13202A;
  --bone: #13202A; --joint: #F4F7F8; --muscle: #E2452B; --muscle-lo: #2F72D8;
  --accent: #E2452B; --accent-ink: #FFFFFF; --pos: #2F72D8; --neg: #E2452B; --ok: #1E7F55;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1218; --panel: #121C24; --panel-2: #18242E; --ink: #E5ECF0; --ink-2: #92A5B1; --line: #25333E;
    --stage: #0E171E; --grid: #16232C; --grid-2: #213039; --ground: #1A2832; --ground-top: #A3B7C3;
    --bone: #DDE6EB; --joint: #121C24; --muscle: #FF6B4E; --muscle-lo: #5E9BFF;
    --accent: #FF6B4E; --accent-ink: #1A0C08; --pos: #5E9BFF; --neg: #FF6B4E; --ok: #46C089;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1218; --panel: #121C24; --panel-2: #18242E; --ink: #E5ECF0; --ink-2: #92A5B1; --line: #25333E;
  --stage: #0E171E; --grid: #16232C; --grid-2: #213039; --ground: #1A2832; --ground-top: #A3B7C3;
  --bone: #DDE6EB; --joint: #121C24; --muscle: #FF6B4E; --muscle-lo: #5E9BFF;
  --accent: #FF6B4E; --accent-ink: #1A0C08; --pos: #5E9BFF; --neg: #FF6B4E; --ok: #46C089;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--f-body);
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, canvas:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.small { font-size: 12px; }
.muted { color: var(--ink-2); margin: 6px 0 0; }

.app { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font: 700 22px/1 var(--f-display); letter-spacing: -0.02em; }
.logo { width: 30px; height: 30px; color: var(--ink); }
.logo .m { color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 13px; cursor: pointer; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.blurb { color: var(--ink-2); font: 12px var(--f-mono); }
.savestate { margin-left: auto; font: 12px var(--f-mono); color: var(--ink-2); }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 12px; }
.stage, .side { min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.stage { background: var(--stage); }
.side { background: var(--panel); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
.tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 0 10px; min-height: 32px; cursor: pointer; }
.tool svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tool kbd { font: 10px var(--f-mono); color: var(--ink-2); }
.tool[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tool[aria-pressed="true"] kbd { color: var(--bg); opacity: .7; }
.hint { margin-left: auto; font: 11px var(--f-mono); color: var(--ink-2); }
.canvas-wrap { position: relative; flex: 1; min-height: 260px; }
#cv { position: absolute; inset: 0; display: block; touch-action: none; }
.toast { position: absolute; left: 12px; bottom: 12px; max-width: calc(100% - 24px); background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 8px; font-size: 13px; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tab { flex: 1; border: 0; background: transparent; padding: 11px 6px 9px; cursor: pointer; font: 600 13px var(--f-display); color: var(--ink-2); border-bottom: 3px solid transparent; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 18px; }
.block + .block { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
h2 { margin: 0 0 10px; font: 600 12px var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.btnrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 0 12px; min-height: 34px; cursor: pointer; }
.btn:hover { border-color: var(--ink-2); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 28px; padding: 0 9px; font-size: 12px; }
.btn.danger:hover { border-color: var(--neg); color: var(--neg); }
select, input[type="text"], textarea { width: 100%; background: var(--stage); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
select { cursor: pointer; }
textarea { font: 11px/1.4 var(--f-mono); height: 104px; resize: vertical; }
.rng { display: block; margin: 0 0 10px; }
.rng-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.rng output { color: var(--ink-2); font-size: 12px; }
.rng input[type="range"] { width: 100%; margin: 4px 0 0; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; margin: 0; }
.facts dt { color: var(--ink-2); }
.facts dd { margin: 0; text-align: right; font: 13px var(--f-mono); font-variant-numeric: tabular-nums; }
.sel-title { font: 600 15px var(--f-display); margin-bottom: 8px; }
.warn { color: var(--neg); margin: 8px 0 0; font-size: 13px; }
.layer-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.layer-row .btn { margin-bottom: 10px; }
.progress { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin: 12px 0 6px; }
.progress div { height: 100%; width: 0; background: var(--accent); }
canvas.side-cv { display: block; width: 100%; border-radius: 8px; background: var(--stage); border: 1px solid var(--line); }
#brainCv { height: 200px; }
#chartCv { height: 160px; margin-top: 12px; }
.snaplist { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
.snaplist li { border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; background: var(--panel-2); }
.snaplist .meta { display: block; color: var(--ink-2); margin: 2px 0 8px; }
.snaplist li.empty { background: transparent; border-style: dashed; color: var(--ink-2); }

@media (min-width: 901px) {
  html, body { height: 100%; }
  .app { height: 100%; }
}
@media (max-width: 900px) {
  .main { display: flex; flex-direction: column; }
  .stage { height: min(64vh, 540px); min-height: 340px; }
  .side { overflow: visible; }
  .pane { overflow: visible; }
  .savestate { margin-left: 0; }
  .hint { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

  <header class="top">

        <circle cx="6" cy="24" r="3" fill="var(--bg)"/><circle cx="26" cy="24" r="3" fill="var(--bg)"/><circle cx="16" cy="7" r="3" fill="var(--bg)"/>
        <path d="M8.2 22 14 9.6"/><path class="m" d="M18 9.4 24 21" stroke="var(--accent)"/><path d="M9 24h14" stroke-dasharray="1 4.2"/>

    </div>

        <div class="tools" id="barEdit">
          <button class="tool" data-tool="select" aria-pressed="true"><svg viewBox="0 0 16 16"><path d="M4 2.5l8.5 5-4 1.2-1.5 4z" fill="currentColor"/></svg>Move <kbd>V</kbd></button>
          <button class="tool" data-tool="joint" aria-pressed="false"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="4"/></svg>Joint <kbd>J</kbd></button>
          <button class="tool" data-tool="bone" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M3.5 12.5l9-9" stroke-width="3"/></svg>Bone <kbd>B</kbd></button>

        </div>

    </aside>

<script>
/* ===== Gaitworks core: physics, brain, evolution (no DOM) ===== */
const Core = (() => {
'use strict';
const DT = 1 / 60, SUB = 4, ITER = 3, G = 9.81, DAMP = 0.9992;
const MUSCLE_RATE = 10, MUSCLE_SLEW = 0.2,  MUSCLE_F = 80, MUSCLE_MASS = 0.1;
const X0 = -30, X1 = 420;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function gauss() {
  let u = 0;
  while (u === 0) u = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * Math.random());
}
const nodeRadius = (m) => 0.06 + 0.04 * Math.sqrt(m);

/* ---------- Terrain: one-sided polyline, bucketed by metre ---------- */
function buildTerrain(kind) {
  const pts = [], obstacles = [];
  let fn;
  if (kind === 'hurdles') {
    pts.push([X0, 0]);
    let x = 6, i = 0;
    while (x < X1 - 12) {
      const h = Math.min(6.0, 0.3 + 0.35 * i), w = 1.0;   /* a ramp: 0.3 m, 0.65 m, 1.0 m, 1.35 m ... up to 6 m */
      pts.push([x, 0], [x, h], [x + w, h], [x + w, 0]);
      obstacles.push({ x0: x, x1: x + w, h });
      x += 8 + Math.min(i, 10) * 0.6;
      i++;
    }
    pts.push([X1, 0]);
    fn = (xx) => {
      for (let k = 0; k < obstacles.length; k++) {
        const o = obstacles[k];
        if (xx >= o.x0 && xx <= o.x1) return o.h;
        if (o.x0 > xx) break;
      }
      return 0;
    };
  } else if (kind.startsWith('hills')) {
    /* Deterministic rough terrain: steep ramps, sharp ridges, vertical steps, drops, sawteeth and pits. */
    let seed = 20261029 + 7919 * (+kind.slice(5) || 0);   /* hills, hills1, hills2 ... = different layouts */
    const rnd = () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    pts.push([X0, 0], [6, 0]);
    let x = 6, y = 0;
    const add = (nx, ny) => { x = nx; y = ny; pts.push([x, y]); };
    while (x < X1 - 10) {
      const d = Math.min(1, (x - 6) / 100), amp = 0.3 + 1.2 * d, r = rnd();
      const up = y < -1.2 ? 1 : y > 3.0 ? -1 : (rnd() < 0.55 ? 1 : -1);
      if (r < 0.24) {                       /* steep ramp, up to about 50 degrees */
        add(x + 1.8 + rnd() * 2.4, y + up * (0.9 + rnd() * 1.2) * amp);
        add(x + 1.5 + rnd() * 3.0, y);
      } else if (r < 0.5) {                 /* vertical step */
        add(x, y + up * (0.54 + rnd() * 0.96) * amp);
        add(x + 2.4 + rnd() * 4.0, y);
      } else if (r < 0.68) {                /* sharp ridge */
        const base = y, hp = (0.9 + rnd() * 1.05) * amp;
        add(x + 1.3 + rnd() * 1.5, base + hp);
        add(x + 1.3 + rnd() * 1.5, base);
      } else if (r < 0.86) {                /* sawteeth: a ramp then a sheer drop */
        const base = y, n = 3 + Math.floor(rnd() * 3);
        for (let k = 0; k < n; k++) { add(x + 1.2, base + 0.72 * amp); add(x, base); }
        add(x + 1.8, base);
      } else {                              /* pit with vertical walls */
        const base = y;
        add(x, base - 0.9 * amp); add(x + 1.5 + rnd() * 1.5, base - 0.9 * amp); add(x, base);
        add(x + 2.4, base);
      }
    }
    pts.push([X1, y]);
    fn = (xx) => {
      const Pp = pts;
      let lo = 0, hi = Pp.length - 1;
      if (xx <= Pp[0][0]) return Pp[0][1];
      if (xx >= Pp[hi][0]) return Pp[hi][1];
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (Pp[mid][0] <= xx) lo = mid; else hi = mid; }
      const a = Pp[lo], b = Pp[hi], dx = b[0] - a[0];
      return dx < 1e-9 ? b[1] : a[1] + ((b[1] - a[1]) * (xx - a[0])) / dx;
    };
  } else if (kind === 'stairs') {
    /* A staircase that keeps rising; each riser is taller than the last (0.18 m, 0.225 m, ... up to 1 m). */
    pts.push([X0, 0], [6, 0]);
    let x = 6, y = 0, i = 0;
    while (x < X1 - 12) {
      const rise = Math.min(1.0, 0.18 + 0.045 * i), tread = 2.2;
      y += rise; pts.push([x, y]); x += tread; pts.push([x, y]);
      i++;
    }
    pts.push([X1, y]);
    fn = (xx) => {
      const Pp = pts;
      let lo = 0, hi = Pp.length - 1;
      if (xx <= Pp[0][0]) return Pp[0][1];
      if (xx >= Pp[hi][0]) return Pp[hi][1];
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (Pp[mid][0] <= xx) lo = mid; else hi = mid; }
      const A = Pp[lo], B = Pp[hi], dx = B[0] - A[0];

/* ---------------- drawing: shared ---------------- */
function drawBackdrop(cam, sc, gy) {
  for (const [par, amp, fr, al] of [[0.25, 0.9, 0.19, 0.35], [0.5, 0.55, 0.33, 0.55]]) {
    ctx.beginPath(); ctx.moveTo(0, gy);
    for (let sx = 0; sx <= W + 8; sx += 8) {
      const wx = (sx - W * 0.38) / sc + cam * par;
      const hg = (Math.sin(wx * fr) + 0.6 * Math.sin(wx * fr * 2.3 + 2)) * amp * sc * 0.5 + amp * sc * 0.9;
      ctx.lineTo(sx, gy - hg);

    ctx.lineTo(W, gy); ctx.closePath();
    ctx.globalAlpha = al; ctx.fillStyle = P.grid2; ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawTerrain(T, xl, xr, x2s, y2s) {

  let i = i0;

  ctx.lineTo(x2s(last[0]), H); ctx.closePath();
  ctx.fillStyle = P.ground; ctx.fill();
  ctx.beginPath();
  for (let k = i0; k <= Math.min(i, pts.length - 1); k++) { const x = x2s(pts[k][0]), y = y2s(pts[k][1]); if (k === i0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }

}

  if (t === 'body') { Evo.running = false; Evo.until = Infinity; updateRunBtn(); Ed.pending = null; }
  else if (Replay.refresh || !Replay.sims.length) startReplay();
  if (t === 'archive') renderArchive();
  if (t === 'brain') { renderBrainForm(); renderBrainSummary(); }
  if (t === 'evolve') { Evo.statsDirty = Evo.chartDirty = true; }
  resize();
}
function refreshAll() {
  updateTaskUI(); syncPreset(); renderInspector(); renderFacts(); renderEvoForm();
  renderBrainSummary(); if (S.tab === 'brain') renderBrainForm(); renderEvoStats(); updateRunBtn();
  $('#turbo').checked = Evo.turbo; updateSimInfo();
  if (S.tab !== 'body') startReplay();
  if (S.tab === 'archive') renderArchive();
}
function wire() {
  $$('#taskSeg button').forEach((b) => b.addEventListener('click', () => setTask(b.dataset.task)));
  $$('.tab').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $$('.tool').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
  $$('#modeSeg button').forEach((b) => b.addEventListener('click', () => {
    Replay.mode = b.dataset.mode; Replay.pick = null; Evo.chartDirty = true;
    $$('#modeSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    startReplay();
  }));
  $$('#speedSeg button').forEach((b) => b.addEventListener('click', () => {
    Replay.speed = +b.dataset.speed;
    $$('#speedSeg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
  const ps = $('#presetSel');
  Object.keys(PRESETS).forEach((k) => { const o = el('option', '', PRESETS[k].label); o.value = k; ps.append(o); });
  const oc = el('option', '', 'Custom design'); oc.value = 'custom'; ps.append(oc);
  ps.addEventListener('change', () => { if (PRESETS[ps.value]) loadPreset(ps.value); });
  $('#undoBtn').addEventListener('click', doUndo);
  twoStep($('#clearBtn'), 'Remove everything?', () => { pushUndo(); S.def = { nodes: [], bones: [], muscles: [] }; Ed.sel = null; Ed.pending = null; bodyChanged(); });
  $('#toEvolve').addEventListener('click', () => { if (!canEvolve()) return; setTab('evolve'); Evo.running = true; updateRunBtn(); });
  $('#applyBrain').addEventListener('click', () => {
    S.brain = clone(draft); resetPopulation(); draft = null;
    renderBrainForm(); renderBrainSummary(); refreshAll(); saveSoon(); toast('New architecture applied with a fresh random population.');
  });
  $('#runBtn').addEventListener('click', () => {
    if (!canEvolve()) return;
    Evo.running = !Evo.running; Evo.until = Infinity; updateRunBtn(); Evo.statsDirty = true;
  });
  $('#stepBtn').addEventListener('click', () => {
    if (!canEvolve()) return;
    Evo.until = Evo.gen + 1; Evo.running = true; updateRunBtn();
  });
  $('#turbo').addEventListener('change', (e) => { Evo.turbo = e.target.checked; });
  $('#shakeBtn').addEventListener('click', shakeUp);
  $('#archCv').addEventListener('click', pickArch);
  twoStep($('#restartBtn'), 'Discard progress?', () => { resetPopulation(); refreshAll(); saveSoon(); toast('Fresh random brains.'); });
  $('#snapBtn').addEventListener('click', saveSnapshot);
  $('#snapName').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveSnapshot(); });
  $('#exportBtn').addEventListener('click', () => { $('#xfer').value = JSON.stringify(serialize(24)); toast('Current state written to the box.'); });
  $('#copyBtn').addEventListener('click', copyText);
  $('#fileBtn').addEventListener('click', saveFile);
  $('#importBtn').addEventListener('click', () => importText($('#xfer').value));
  $('#importFile').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => importText(String(rd.result));
    rd.readAsText(f);
    e.target.value = '';
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
  window.addEventListener('pagehide', saveNow);
}

/* ---------------- main loop ---------------- */
let lastT = performance.now(), lastUI = 0, frameNo = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now; frameNo++;
  if (S.tab !== 'body') evoTick(Evo.turbo ? 45 : 9);
  if (mode() === 'edit') drawEditor();
  else { stepReplay(dt); drawSim(); }
  if (now - lastUI > 160) {
    lastUI = now;
    if (S.tab === 'evolve') {
      if (Evo.statsDirty) renderEvoStats();
      if (Evo.chartDirty) { drawChart(); drawArch(); }
    }
  }
  if (S.tab === 'brain' && frameNo % 2 === 0) drawBrain();
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
function boot() {
  readPalette();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readPalette);
  new MutationObserver(readPalette).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
  new ResizeObserver(resize).observe($('#wrap'));
  resize(); wire();
  storageOK = lsSet('gaitworks.probe', '1');
  if (storageOK) { try { localStorage.removeItem('gaitworks.probe'); } catch (e) { /* ignore */ } }
  let restored = false;
  const raw = storageOK ? lsGet(KEY_SESSION) : null;
  if (raw) {
    try { applySession(JSON.parse(raw)); restored = true; }
    catch (e) { restored = false; }
  }
  if (!restored) { rebuildNet(); lastSig = Core.topoSig(S.def); resetPopulation(); refreshAll(); }
  setTool('select'); setTab('body');
  $('#saveState').textContent = storageOK ? (restored ? 'Restored generation ' + Evo.gen : 'Autosave on') : 'Not saving: browser storage is blocked. Use Archive to export.';
  if (restored && Evo.gen > 0) toast('Picked up where you left off: generation ' + Evo.gen + '.');
  requestAnimationFrame(frame);
}
boot();
})();

</script>
</body>
</html>
